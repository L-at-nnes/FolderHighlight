name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: FolderHighlight
          path: target/release/FolderHighlight.exe
          if-no-files-found: error

  release:
    # Pushing a tag such as v2.0.1 publishes the executable as a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FolderHighlight

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" FolderHighlight.exe --repo "${{ github.repository }}" --generate-notes

  latest:
    # Every push to the main branch refreshes a rolling "latest" pre-release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FolderHighlight

      - name: Refresh latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$REPO" || true
          gh release create latest FolderHighlight.exe --repo "$REPO" --target "${{ github.sha }}" \
            --prerelease --title "Latest build" \
            --notes "Automatic build of commit ${{ github.sha }}."
