[package]
name = "folderhighlight"
version = "2.0.0"
edition = "2021"
description = "Colorize Windows folders from the Explorer context menu"
license = "MIT"
publish = false

[[bin]]
name = "FolderHighlight"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
miniz_oxide = "0.8"
